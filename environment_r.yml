# Software for Single_Cell_Master_Guide_R.md, as tested on 31 Oct 2026 (macOS, Apple Silicon).
# Create it once:   conda env create -f environment_r.yml
#                   conda activate scanalysis-r
# Then compile the three packages bioconda does not build for Apple Silicon (~10 minutes, once):
#   Rscript -e 'options(repos = c(CRAN = "https://cloud.r-project.org")); BiocManager::install(c("SingleR", "scrapper", "slingshot"), update = FALSE, ask = FALSE)'
# Tested versions: R 4.5.3, Bioconductor 3.22, Seurat 5.5.1, SeuratObject 5.4.0, harmony 2.0.5, scDblFinder 1.24.10,
# DESeq2 1.50.2, SingleR 2.12.0, scrapper 1.4.0, celldex 1.20.0, decoupleR 2.16.0, OmnipathR 4.0.0,
# zellkonverter 1.20.1, slingshot 2.18.0, leidenbase 0.1.36, hdf5r 1.3.16.
# With your normal R / RStudio instead, see Section 1, Option B of the R guide.
name: scanalysis-r
channels:
  - conda-forge
  - bioconda
dependencies:
  - r-base=4.5
  - r-seurat
  - r-harmony
  - r-hdf5r
  - r-data.table
  - r-r.utils
  - r-ggplot2
  - r-patchwork
  - r-jsonlite
  - r-matrix
  - r-leidenbase
  - r-biocmanager
  - bioconductor-scdblfinder
  - bioconductor-scuttle
  - bioconductor-deseq2
  - bioconductor-celldex
  - bioconductor-decoupler
  - bioconductor-omnipathr
  - bioconductor-zellkonverter
  - bioconductor-singlecellexperiment
  - c-compiler            # compilers + make: needed to build SingleR / scrapper / slingshot from source
  - cxx-compiler
  - make
